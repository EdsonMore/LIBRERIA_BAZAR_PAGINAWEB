<!-- src/main/resources/templates/error/404.html -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <title th:text="${titulo} + ' - Tu Bazar Plus'">
      Página no encontrada - Tu Bazar Plus
    </title>
  </head>
  <body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main>
      <div class="container my-5">
        <div class="row justify-content-center">
          <div class="col-md-6 text-center">
            <div class="error-icon mb-4">
              <i class="bi bi-search display-1 text-primary"></i>
            </div>
            <h1 class="display-4 text-primary mb-4">404</h1>
            <h2 class="mb-4" th:text="${titulo}">¡Página no encontrada!</h2>

            <div class="alert alert-info" role="alert">
              <i class="bi bi-info-circle me-2"></i>
              <span th:text="${mensaje}"
                >La página que buscas no existe o ha sido movida.</span
              >
            </div>

            <p class="text-muted mb-4">
              No te preocupes, incluso los mejores catadores a veces toman el
              camino equivocado. ¡Te ayudaremos a encontrar lo que buscas!
            </p>

            <div class="d-flex justify-content-center gap-2 flex-wrap">
              <a th:href="@{/}" class="btn btn-primary">
                <i class="bi bi-house me-2"></i>
                Volver al Inicio
              </a>
              <a th:href="@{/productos}" class="btn btn-success">
                <i class="bi bi-shop me-2"></i>
                Ver Productos
              </a>
              <button
                onclick="history.back()"
                class="btn btn-outline-secondary"
              >
                <i class="bi bi-arrow-left me-2"></i>
                Volver Atrás
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
  </body>
</html>
