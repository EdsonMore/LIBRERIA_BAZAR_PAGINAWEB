<!-- src/main/resources/templates/error/general.html -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <title th:text="${titulo} + ' - Tu Bazar Plus'">
      Error - Tu Bazar Plus
    </title>
  </head>
  <body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main>
      <div class="container my-5">
        <div class="row justify-content-center">
          <div class="col-md-6 text-center">
            <div class="error-icon mb-4">
              <i class="bi bi-emoji-frown display-1 text-muted"></i>
            </div>
            <h1 class="display-4 text-muted mb-4">Error</h1>
            <h2 class="mb-4" th:text="${titulo}">Ha ocurrido un error</h2>

            <div class="alert alert-secondary" role="alert">
              <i class="bi bi-info-circle me-2"></i>
              <span th:text="${mensaje}">Ha ocurrido un error inesperado.</span>
            </div>

            <p class="text-muted mb-4">
              Lamentamos las molestias. Estamos trabajando para mejorar tu
              experiencia.
            </p>

            <div class="d-flex justify-content-center gap-2 flex-wrap">
              <a th:href="@{/}" class="btn btn-primary">
                <i class="bi bi-house me-2"></i>
                Volver al Inicio
              </a>
              <a th:href="@{/productos}" class="btn btn-success">
                <i class="bi bi-shop me-2"></i>
                Ver Productos
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
  </body>
</html>
