<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <div
      th:replace="~{fragments/layout :: head}"
      th:with="titulo='Libro de Reclamaciones - Tu Bazar Plus'"
    ></div>
  </head>

  <body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Hero -->
    <div
      th:replace="~{fragments/layout :: hero(
      'Libro de Reclamaciones',
      'Tu satisfacción es nuestra prioridad. Escríbenos tus comentarios, quejas o sugerencias.',
      false,
      ~{:: #vacio}
    )}"
    >
      <div id="vacio"></div>
    </div>

    <!-- Formulario -->
    <section class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-10">
            <div class="card shadow-lg border-0">
              <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0 fw-bold">
                  <i class="bi bi-pencil-square me-2"></i>Formulario de
                  Reclamación
                </h4>
              </div>

              <div class="card-body p-4">
                <form
                  th:action="@{/libro-reclamaciones}"
                  method="post"
                  class="needs-validation"
                  novalidate
                >
                  <!-- Información personal -->
                  <div class="mb-4">
                    <h5 class="fw-bold text-dark mb-3">
                      <i class="bi bi-person-circle me-2"></i>Información
                      Personal
                    </h5>
                    <div class="row g-3">
                      <div class="col-md-6">
                        <div
                          th:replace="~{fragments/form-elements :: input-icon('nombre', 'Nombre', 'text', 'Ingrese su nombre', true, '', 'person')}"
                        ></div>
                      </div>
                      <div class="col-md-6">
                        <div
                          th:replace="~{fragments/form-elements :: input-icon('apellidos', 'Apellidos', 'text', 'Ingrese sus apellidos', true, '', 'person')}"
                        ></div>
                      </div>
                      <div class="col-md-6">
                        <div
                          th:replace="~{fragments/form-elements :: input-icon('email', 'Correo electrónico', 'email', 'correo@ejemplo.com', true, '', 'envelope')}"
                        ></div>
                      </div>
                      <div class="col-md-6">
                        <div
                          th:replace="~{fragments/form-elements :: input-icon('telefono', 'Teléfono (opcional)', 'tel', '999888777', false, '', 'telephone')}"
                        ></div>
                      </div>
                    </div>
                  </div>

                  <!-- Documentación -->
                  <div class="mb-4">
                    <h5 class="fw-bold text-dark mb-3">
                      <i class="bi bi-card-text me-2"></i>Documentación
                    </h5>
                    <div class="row g-3">
                      <div class="col-md-6">
                        <div
                          th:replace="~{fragments/form-elements :: select('tipoDocumento', 'Tipo de documento', ${tiposDocumento}, true, '')}"
                        ></div>
                      </div>
                      <div class="col-md-6">
                        <div
                          th:replace="~{fragments/form-elements :: input-icon('numeroDocumento', 'Número de documento', 'text', '00000000', true, '', 'credit-card')}"
                        ></div>
                      </div>
                    </div>
                  </div>

                  <!-- Información de contacto -->
                  <div class="mb-4">
                    <h5 class="fw-bold text-dark mb-3">
                      <i class="bi bi-geo-alt me-2"></i>Información de Contacto
                    </h5>
                    <div class="row g-3">
                      <div class="col-md-8">
                        <div
                          th:replace="~{fragments/form-elements :: input-icon('direccion', 'Dirección', 'text', 'Av. Principal 123...', true, '', 'house')}"
                        ></div>
                      </div>
                      <div class="col-md-4">
                        <div
                          th:replace="~{fragments/form-elements :: input-icon('codigoPostal', 'Código Postal', 'text', '20001', false, '', 'postcard')}"
                        ></div>
                      </div>
                    </div>
                  </div>

                  <!-- Tipo de solicitud -->
                  <div class="mb-4">
                    <h5 class="fw-bold text-dark mb-3">
                      <i class="bi bi-clipboard-check me-2"></i>Tipo de
                      Solicitud
                    </h5>
                    <div class="row g-3">
                      <div class="col-md-6">
                        <div
                          th:replace="~{fragments/form-elements :: select('tipoSolicitud', 'Tipo de solicitud', ${tiposSolicitud}, true, '')}"
                        ></div>
                      </div>
                      <div class="col-md-6">
                        <div
                          th:replace="~{fragments/form-elements :: input-icon('fechaIncidente', 'Fecha del incidente', 'date', '', true, '', 'calendar')}"
                        ></div>
                      </div>
                    </div>
                  </div>

                  <!-- Detalle de la solicitud -->
                  <div class="mb-4">
                    <h5 class="fw-bold text-dark mb-3">
                      <i class="bi bi-chat-dots me-2"></i>Detalle de su
                      Solicitud
                    </h5>
                    <div
                      th:replace="~{fragments/form-elements :: textarea('detalleSolicitud', 'Describa detalladamente su reclamo o queja', 'Describa su solicitud...', 6, true, '')}"
                    ></div>
                  </div>

                  <!-- Evidencia -->
                  <div class="mb-4">
                    <h5 class="fw-bold text-dark mb-3">
                      <i class="bi bi-paperclip me-2"></i>Evidencia (Opcional)
                    </h5>
                    <div
                      th:replace="~{fragments/form-elements :: file-input('evidencia', 'Adjuntar archivo', false, '.jpg,.jpeg,.png,.pdf,.doc,.docx')}"
                    ></div>
                    <div class="form-text">
                      <i class="bi bi-info-circle me-1"></i>
                      Formatos: JPG, PNG, PDF, DOC, DOCX. Máx: 5MB.
                    </div>
                  </div>

                  <!-- Términos -->
                  <div class="mb-4">
                    <div
                      th:replace="~{fragments/form-elements :: checkbox('terminos', 'Acepto los términos y condiciones y autorizo el tratamiento de mis datos', true, false)}"
                    ></div>
                  </div>

                  <!-- Botones -->
                  <div class="d-flex gap-3 justify-content-center">
                    <button
                      type="reset"
                      class="btn btn-outline-dark btn-lg px-4"
                    >
                      <i class="bi bi-arrow-clockwise me-2"></i>Limpiar
                    </button>
                    <div
                      th:replace="~{fragments/form-elements :: submit-button('Enviar Reclamación', 'dark', 'send')}"
                    ></div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Información adicional -->
    <section class="py-4 bg-secondary text-white">
      <div class="container">
        <div class="row text-center">
          <div class="col-md-4 mb-3 mb-md-0">
            <i class="bi bi-clock display-6 mb-2"></i>
            <h5 class="fw-bold">Tiempo de Respuesta</h5>
            <p class="mb-0">Máximo 48 horas</p>
          </div>
          <div class="col-md-4 mb-3 mb-md-0">
            <i class="bi bi-shield-check display-6 mb-2"></i>
            <h5 class="fw-bold">Confidencialidad</h5>
            <p class="mb-0">Datos 100% seguros</p>
          </div>
          <div class="col-md-4">
            <i class="bi bi-telephone display-6 mb-2"></i>
            <h5 class="fw-bold">Soporte</h5>
            <p class="mb-0">+51 999 888 777</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>

    

  </body>
</html>
