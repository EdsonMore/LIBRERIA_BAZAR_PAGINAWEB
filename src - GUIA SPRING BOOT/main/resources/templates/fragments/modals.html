<!-- src/main/resources/templates/fragments/modals.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div th:fragment="modal-producto">
      <!-- Modal para Agregar/Editar Producto -->
      <div class="modal fade" id="modalProducto" tabindex="-1">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitulo">Nuevo Producto</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <form
              id="formProducto"
              th:action="@{/superAdmin/productos/guardar}"
              method="post"
              enctype="multipart/form-data"
            >
              <div class="modal-body">
                <input type="hidden" id="productoId" name="id" value="0" />

                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="nombre" class="form-label"
                        >Nombre del Producto *</label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="nombre"
                        name="nombre"
                        required
                        placeholder="Ej: Whisky Jack Daniels"
                        maxlength="100"
                      />
                    </div>

                    <div class="mb-3">
                      <label for="categoriaId" class="form-label"
                        >Categoría *</label
                      >
                      <select
                        class="form-select"
                        id="categoriaId"
                        name="categoriaId"
                        required
                      >
                        <option value="">Seleccione una categoría</option>
                        <!-- Las categorías se cargan dinámicamente -->
                      </select>
                    </div>

                    <div class="mb-3">
                      <label for="precio" class="form-label"
                        >Precio (S/) *</label
                      >
                      <input
                        type="number"
                        class="form-control"
                        id="precio"
                        name="precio"
                        step="0.01"
                        min="0"
                        required
                        placeholder="0.00"
                      />
                    </div>

                    <div class="mb-3">
                      <label for="stock" class="form-label">Stock *</label>
                      <input
                        type="number"
                        class="form-control"
                        id="stock"
                        name="stock"
                        min="0"
                        required
                        placeholder="0"
                      />
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="descripcion" class="form-label"
                        >Descripción</label
                      >
                      <textarea
                        class="form-control"
                        id="descripcion"
                        name="descripcion"
                        rows="4"
                        placeholder="Describe el producto..."
                        maxlength="500"
                      ></textarea>
                    </div>

                    <div class="mb-3">
                      <label for="imagenFile" class="form-label"
                        >Imagen del Producto</label
                      >
                      <div class="nav nav-tabs mb-3" role="tablist" id="imagenTabs">
                        <button
                          class="nav-link active"
                          id="tab-upload"
                          data-bs-toggle="tab"
                          data-bs-target="#content-upload"
                          type="button"
                          role="tab"
                        >
                          <i class="bi bi-upload"></i> Subir Archivo
                        </button>
                        <button
                          class="nav-link"
                          id="tab-url"
                          data-bs-toggle="tab"
                          data-bs-target="#content-url"
                          type="button"
                          role="tab"
                        >
                          <i class="bi bi-link"></i> Desde URL
                        </button>
                      </div>

                      <div class="tab-content">
                        <!-- Tab: Subir archivo -->
                        <div
                          class="tab-pane fade show active"
                          id="content-upload"
                          role="tabpanel"
                        >
                          <input
                            type="file"
                            class="form-control"
                            id="imagenFile"
                            name="imagenFile"
                            accept="image/jpeg,image/png,image/webp"
                          />
                          <div class="form-text">
                            Formatos: JPG, PNG, WebP (máx. 5MB). Tamaño recomendado:
                            400x400px
                          </div>
                        </div>

                        <!-- Tab: URL -->
                        <div
                          class="tab-pane fade"
                          id="content-url"
                          role="tabpanel"
                        >
                          <input
                            type="url"
                            class="form-control"
                            id="imagenUrl"
                            name="imagenUrl"
                            placeholder="https://ejemplo.com/imagen.jpg"
                          />
                          <div class="form-text">
                            Ingresa la URL completa de la imagen (ej: https://...)
                          </div>
                        </div>
                      </div>

                      <div id="imagenPreview" class="mt-2 text-center d-none">
                        <img
                          id="previewImg"
                          src="#"
                          alt="Vista previa"
                          class="img-thumbnail"
                          style="max-height: 150px"
                        />
                        <div class="mt-1">
                          <button
                            type="button"
                            class="btn btn-sm btn-outline-danger"
                            onclick="productoManager.limpiarImagen()"
                          >
                            <i class="bi bi-trash"></i> Quitar imagen
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  <i class="bi bi-x-circle"></i> Cancelar
                </button>
                <button
                  type="submit"
                  class="btn btn-primary"
                  id="btnGuardarProducto"
                >
                  <i class="bi bi-check-circle"></i> Guardar Producto
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
