<!-- src/main/resources/templates/fragments/footer.html -->

<!-- Pie de página principal de la aplicación -->
<footer class="text-white pt-4" th:fragment="footer" style="background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);">
  <div class="container">
    <div class="row">
      <!-- Información de contacto y ubicación de la empresa -->
      <div class="col-md-4 mb-4">
        <h5 class="fw-bold">Tu Bazar Plus</h5>
        <p class="mb-2">Tu bazar de confianza desde 2018</p>
        <address class="mb-0">
          <i class="bi bi-geo-alt"></i> Catacaos, Piura, PE<br />
          <i class="bi bi-phone"></i> +51 999 888 777<br />
          <i class="bi bi-envelope"></i> info@elbuenbeber.com<br />
          <i class="bi bi-clock"></i> Lunes - Sábado: 9am - 11pm
        </address>
      </div>

      <!-- Navegación rápida por la página -->
      <div class="col-md-4 mb-4">
        <h5 class="fw-bold">Enlaces rápidos</h5>
        <nav>
          <ul class="list-unstyled">
            <li>
              <a th:href="@{/}" class="text-white text-decoration-none"
                >Inicio</a
              >
            </li>
            <li>
              <a th:href="@{/productos}" class="text-white text-decoration-none"
                >Productos</a
              >
            </li>
            <li>
              <a href="#ofertas" class="text-white text-decoration-none"
                >Ofertas</a
              >
            </li>
            <li>
              <a
                th:href="@{/sobre-nosotros}"
                class="text-white text-decoration-none"
                >Sobre Nosotros</a
              >
            </li>
            <li>
              <a
                th:href="@{/libro-reclamaciones}"
                class="text-white text-decoration-none"
                >Libro de reclamaciones</a
              >
            </li>
            <li>
              <a th:href="@{/contacto}" class="text-white text-decoration-none"
                >Contacto</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </div>

    <!-- Línea divisoria y derechos de autor -->
    <hr class="my-3 border-light" />
    <div class="text-center">
      <p class="mb-0">
        &copy;
        <span th:text="${#dates.year(#dates.createNow())}">2025</span> Tu Bazar Plus. Todos los derechos reservados.
      </p>
    </div>
  </div>
</footer>
