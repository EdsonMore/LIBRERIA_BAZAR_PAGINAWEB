<!-- src/main/resources/templates/fragments/messages.html -->

<!-- Alerta de operación exitosa -->
<div th:fragment="success(mensaje)" th:if="${mensaje}">
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle-fill me-2"></i>
    <span th:text="${mensaje}">Operación exitosa</span>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="alert"
      aria-label="Cerrar"
    ></button>
  </div>
</div>

<!-- Alerta de error en operación -->
<div th:fragment="error(mensaje)" th:if="${mensaje}">
  <div class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <span th:text="${mensaje}">Ha ocurrido un error</span>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="alert"
      aria-label="Cerrar"
    ></button>
  </div>
</div>

<!-- Alerta de advertencia o precaución -->
<div th:fragment="warning(mensaje)" th:if="${mensaje}">
  <div class="alert alert-warning alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-circle-fill me-2"></i>
    <span th:text="${mensaje}">Advertencia</span>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="alert"
      aria-label="Cerrar"
    ></button>
  </div>
</div>

<!-- Alerta informativa general -->
<div th:fragment="info(mensaje)" th:if="${mensaje}">
  <div class="alert alert-info alert-dismissible fade show" role="alert">
    <i class="bi bi-info-circle-fill me-2"></i>
    <span th:text="${mensaje}">Información</span>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="alert"
      aria-label="Cerrar"
    ></button>
  </div>
</div>

<!-- Sistema de mensajes flash automáticos desde el controlador -->
<div th:fragment="flash-messages">
  <!-- Mensaje de éxito desde el backend -->
  <div th:if="${successMessage}" class="container mt-3">
    <div class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="bi bi-check-circle-fill me-2"></i>
      <span th:text="${successMessage}">Operación exitosa</span>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Cerrar"
      ></button>
    </div>
  </div>

  <!-- Mensaje de error desde el backend -->
  <div th:if="${errorMessage}" class="container mt-3">
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span th:text="${errorMessage}">Ha ocurrido un error</span>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Cerrar"
      ></button>
    </div>
  </div>

  <!-- Mensaje de advertencia desde el backend -->
  <div th:if="${warningMessage}" class="container mt-3">
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-circle-fill me-2"></i>
      <span th:text="${warningMessage}">Advertencia</span>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Cerrar"
      ></button>
    </div>
  </div>

  <!-- Mensaje informativo desde el backend -->
  <div th:if="${infoMessage}" class="container mt-3">
    <div class="alert alert-info alert-dismissible fade show" role="alert">
      <i class="bi bi-info-circle-fill me-2"></i>
      <span th:text="${infoMessage}">Información</span>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Cerrar"
      ></button>
    </div>
  </div>
</div>

<!-- Mostrar errores de validación de formularios -->
<div th:fragment="validation-errors" th:if="${#fields.hasErrors('*')}">
  <div class="alert alert-danger" role="alert">
    <h5 class="alert-heading">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      Errores de validación
    </h5>
    <ul class="mb-0">
      <li th:each="err : ${#fields.errors('*')}" th:text="${err}">
        Error de validación
      </li>
    </ul>
  </div>
</div>

<!-- Modal reutilizable para confirmaciones de acción -->
<div th:fragment="confirm-modal(id, titulo, mensaje, urlAction)">
  <div
    class="modal fade"
    th:id="${id}"
    tabindex="-1"
    aria-labelledby="${id + 'Label'}"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" th:id="${id + 'Label'}" th:text="${titulo}">
            Confirmar acción
          </h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Cerrar"
          ></button>
        </div>
        <div class="modal-body" th:text="${mensaje}">
          ¿Está seguro de realizar esta acción?
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancelar
          </button>
          <form th:action="${urlAction}" method="post" class="d-inline">
            <button type="submit" class="btn btn-danger">Confirmar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
