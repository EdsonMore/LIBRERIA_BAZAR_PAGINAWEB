<!-- src/main/resources/templates/fragments/form-elements.html -->

<!-- Campo de entrada de texto básico -->
<div th:fragment="input(id, label, type, placeholder, required, value)">
  <div class="mb-3">
    <label th:for="${id}" class="form-label" th:text="${label}">Label</label>
    <input
      th:type="${type} ?: 'text'"
      th:id="${id}"
      th:name="${id}"
      th:placeholder="${placeholder}"
      th:required="${required}"
      th:value="${value}"
      class="form-control"
    />
  </div>
</div>

<!-- Campo de texto multilínea -->
<div th:fragment="textarea(id, label, placeholder, rows, required, value)">
  <div class="mb-3">
    <label th:for="${id}" class="form-label" th:text="${label}">Label</label>
    <textarea
      th:id="${id}"
      th:name="${id}"
      th:placeholder="${placeholder}"
      th:rows="${rows} ?: 3"
      th:required="${required}"
      class="form-control"
      th:text="${value}"
    ></textarea>
  </div>
</div>

<!-- Lista desplegable de selección -->
<div th:fragment="select(id, label, options, required, selected)">
  <div class="mb-3">
    <label th:for="${id}" class="form-label" th:text="${label}">Label</label>
    <select
      th:id="${id}"
      th:name="${id}"
      th:required="${required}"
      class="form-select"
    >
      <option value="">Seleccionar...</option>
      <option
        th:each="option : ${options}"
        th:value="${option}"
        th:text="${option}"
        th:selected="${option == selected}"
      >
        [[${option}]]
      </option>
    </select>
  </div>
</div>

<!-- Casilla de verificación individual -->
<div th:fragment="checkbox(id, label, required, checked)">
  <div class="mb-3 form-check">
    <input
      type="checkbox"
      th:id="${id}"
      th:name="${id}"
      th:required="${required}"
      th:checked="${checked}"
      class="form-check-input"
    />
    <label th:for="${id}" class="form-check-label" th:text="${label}">
      Label
    </label>
  </div>
</div>

<!-- Grupo de botones de opción (radio buttons) -->
<div th:fragment="radio-group(name, label, options, required, selected)">
  <div class="mb-3">
    <label class="form-label" th:text="${label}">Label</label>
    <div th:each="option : ${options}" class="form-check">
      <input
        type="radio"
        th:id="${name + '_' + option.value}"
        th:name="${name}"
        th:value="${option.value}"
        th:required="${required}"
        th:checked="${option.value == selected}"
        class="form-check-input"
      />
      <label
        th:for="${name + '_' + option.value}"
        th:text="${option.text}"
        class="form-check-label"
      >
        Opción
      </label>
    </div>
  </div>
</div>

<!-- Campo de entrada con ícono decorativo -->
<div
  th:fragment="input-icon(id, label, type, placeholder, required, value, icon)"
>
  <div class="mb-3">
    <label th:for="${id}" class="form-label" th:text="${label}">Label</label>
    <div class="input-group">
      <span class="input-group-text">
        <i th:class="${'bi bi-' + icon}"></i>
      </span>
      <input
        th:type="${type} ?: 'text'"
        th:id="${id}"
        th:name="${id}"
        th:placeholder="${placeholder}"
        th:required="${required}"
        th:value="${value}"
        class="form-control"
      />
    </div>
  </div>
</div>

<!-- Botón para enviar formularios -->
<div th:fragment="submit-button(text, variant, icon)">
  <button
    type="submit"
    th:class="${'btn btn-' + (variant ?: 'primary') + ' w-100'}"
  >
    <i th:if="${icon}" th:class="${'bi bi-' + icon + ' me-2'}"></i>
    <span th:text="${text}">Enviar</span>
  </button>
</div>

<!-- Selector de archivos para subir -->
<div th:fragment="file-input(id, label, required, accept)">
  <div class="mb-3">
    <label th:for="${id}" class="form-label" th:text="${label}">Label</label>
    <input
      type="file"
      th:id="${id}"
      th:name="${id}"
      th:required="${required}"
      th:accept="${accept}"
      class="form-control"
    />
  </div>
</div>
