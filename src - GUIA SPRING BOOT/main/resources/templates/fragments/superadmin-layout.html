<!-- src/main/resources/templates/fragments/superadmin-layout.html -->

<!-- Head específico para SuperAdmin con estilos adicionales -->
<th:block th:fragment="head(pageTitle)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />

  <title th:text="${pageTitle} + ' - Super Admin | Tu Bazar Plus'">
    Super Admin - Tu Bazar Plus
  </title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />

  <!-- SweetAlert2 -->
  <link
    href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css"
    rel="stylesheet"
  />

  <!-- Estilos personalizados -->
  <link rel="stylesheet" th:href="@{/css/global.css}" />
  <link rel="icon" type="image/x-icon" th:href="@{/img/logo1.jpg}" />

  <style>
    .sidebar {
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      overflow-y: auto;
    }

    .stats-card {
      transition: transform 0.2s;
      border-radius: 0.75rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .card {
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }

    .review-card {
      transition: all 0.3s ease;
      border-left: 4px solid transparent;
    }

    .review-card.pendiente {
      border-left-color: #ffc107;
      background-color: rgba(255, 193, 7, 0.05);
    }
    .review-card.aprobada {
      border-left-color: #198754;
      background-color: rgba(25, 135, 84, 0.05);
    }
    .review-card.rechazada {
      border-left-color: #dc3545;
      background-color: rgba(220, 53, 69, 0.05);
    }

    .categoria-img {
      height: 80px;
      object-fit: cover;
    }
  </style>
</th:block>

<!-- Sidebar del SuperAdmin -->
<aside th:fragment="sidebar(activeSection)" class="col-md-3 col-lg-2">
  <div class="list-group sidebar shadow-sm">
    <a
      th:href="@{/superAdmin/dashboard}"
      th:classappend="${activeSection == 'dashboard'} ? 'active' : ''"
      class="list-group-item list-group-item-action"
    >
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a
      th:href="@{/superAdmin/usuarios}"
      th:classappend="${activeSection == 'usuarios'} ? 'active' : ''"
      class="list-group-item list-group-item-action"
    >
      <i class="bi bi-people"></i> Gestión de Usuarios
    </a>
    <a
      th:href="@{/superAdmin/roles}"
      th:classappend="${activeSection == 'roles'} ? 'active' : ''"
      class="list-group-item list-group-item-action"
    >
      <i class="bi bi-shield-check"></i> Gestión de Roles
    </a>
    <a
      th:href="@{/superAdmin/productos}"
      th:classappend="${activeSection == 'productos'} ? 'active' : ''"
      class="list-group-item list-group-item-action"
    >
      <i class="bi bi-box"></i> Gestión de Productos
    </a>
    <a
      th:href="@{/superAdmin/categorias}"
      th:classappend="${activeSection == 'categorias'} ? 'active' : ''"
      class="list-group-item list-group-item-action"
    >
      <i class="bi bi-tags"></i> Gestión de Categorías
    </a>
    <a
      th:href="@{/superAdmin/compras}"
      th:classappend="${activeSection == 'compras'} ? 'active' : ''"
      class="list-group-item list-group-item-action"
    >
      <i class="bi bi-cart-check"></i> Gestión de Compras
    </a>
    <a
      th:href="@{/superAdmin/resenas}"
      th:classappend="${activeSection == 'resenas'} ? 'active' : ''"
      class="list-group-item list-group-item-action"
    >
      <i class="bi bi-chat-left-text"></i> Gestión de Reseñas
    </a>
    <a
      th:href="@{/superAdmin/rutas}"
      th:classappend="${activeSection == 'rutas'} ? 'active' : ''"
      class="list-group-item list-group-item-action"
    >
      <i class="bi bi-signpost"></i> Gestión de Rutas
    </a>
    <hr class="my-2" />
    <a
      th:href="@{/superAdmin/configuracion}"
      th:classappend="${activeSection == 'configuracion'} ? 'active' : ''"
      class="list-group-item list-group-item-action"
    >
      <i class="bi bi-gear"></i> Configuración del Sistema
    </a>
    <a th:href="@{/}" class="list-group-item list-group-item-action">
      <i class="bi bi-shop"></i> Ir a Tienda
    </a>
  </div>
</aside>

<!-- Header de página con título y badge de rol -->
<div
  th:fragment="page-header(titulo, descripcion)"
  class="d-flex justify-content-between align-items-center mb-4"
>
  <div>
    <h2 th:text="${titulo}">Título de Página</h2>
    <p
      th:if="${descripcion}"
      class="text-muted mb-0"
      th:text="${descripcion}"
    ></p>
  </div>
  <div class="text-muted">
    <span th:if="${session.usuario != null}">
      Bienvenido, <strong th:text="${session.usuario.nombres}"></strong>
      <span class="badge bg-danger ms-2">SUPER ADMIN</span>
    </span>
  </div>
</div>

<!-- Tarjetas de estadísticas -->
<div th:fragment="stat-card(valor, titulo, icono, color)">
  <div class="card stats-card text-white" th:classappend="'bg-' + ${color}">
    <div class="card-body d-flex justify-content-between align-items-center">
      <div>
        <h4 th:text="${valor}">0</h4>
        <p class="mb-0" th:text="${titulo}">Título</p>
      </div>
      <i th:class="'bi bi-' + ${icono} + ' fs-1'"></i>
    </div>
  </div>
</div>

<!-- Scripts comunes del SuperAdmin -->
<th:block th:fragment="scripts">
  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- SweetAlert2 -->
  <script
    src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"
  ></script>

  <!-- Scripts personalizados -->
  <script th:src="@{/js/scripts.js}"></script>
  <script th:src="@{/js/toast.js}"></script>
</th:block>

<!-- Filtro de búsqueda reutilizable -->
<div th:fragment="search-filter(placeholder)" class="card mb-4">
  <div class="card-body">
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input
        type="text"
        class="form-control"
        th:placeholder="${placeholder}"
        id="searchInput"
      />
    </div>
  </div>
</div>
