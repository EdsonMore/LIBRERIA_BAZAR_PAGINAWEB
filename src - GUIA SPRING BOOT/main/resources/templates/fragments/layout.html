<!-- src/main/resources/templates/fragments/layout.html -->

<!-- Fragmento para la sección head de todas las páginas -->
<th:block th:fragment="head">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${titulo} ?: 'Tu Bazar Plus - Tienda de Productos Variados'">
    Tu Bazar Plus - Tienda de Productos Variados
  </title>

  <!-- Bootstrap CSS para estilos base -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />

  <!-- SweetAlert2 para alertas y modales atractivos -->
  <link
    href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons para iconografía consistente -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />

  <!-- Estilos personalizados de la aplicación -->
  <link rel="stylesheet" th:href="@{/css/global.css}" />

  <!-- Favicon de la marca -->
  <link rel="icon" type="image/x-icon" th:href="@{/img/logo1.jpg}" />

  <!-- Token CSRF para peticiones AJAX -->
  <meta name="csrf-token" th:content="${_csrf.token}" />
  <meta name="csrf-header" th:content="${_csrf.headerName}" />
</th:block>

<!-- Fragmento para secciones hero (cabeceras destacadas) -->
<th:block th:fragment="hero(titulo, subtitulo, mostrarBotones, cuerpo)">
  <section class="hero-section py-3">
    <div class="container">
      <div class="row">
        <div class="col-lg-8 mx-auto text-center text-black">
          <h1 class="display-3 fw-bold mb-4" th:text="${titulo}">
            Título por defecto
          </h1>
          <p class="lead fs-4 mb-4" th:text="${subtitulo}">
            Subtítulo por defecto
          </p>

          <!-- Contenido adicional personalizable -->
          <div th:if="${cuerpo}" th:replace="${cuerpo}"></div>

          <!-- Botones de acción opcionales -->
          <div
            class="d-flex gap-3 justify-content-center flex-wrap mt-4"
            th:if="${mostrarBotones}"
          >
            <a
              href="#productos-destacados"
              class="btn btn-warning btn-lg px-4 py-2"
            >
              <i class="bi bi-eye"></i> Ver Productos
            </a>
            <a
              th:href="@{/productos}"
              class="btn btn-outline-light btn-lg px-4 py-2"
            >
              <i class="bi bi-shop"></i> Catálogo Completo
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>
</th:block>

<!-- Fragmento para incluir scripts comunes -->
<th:block th:fragment="scripts">
  <!-- Bootstrap JavaScript para componentes interactivos -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>

  <!-- SweetAlert2 para notificaciones y confirmaciones -->
  <script
    src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"
  ></script>

  <!-- Scripts personalizados de la aplicación -->
  <script th:src="@{/js/scripts.js}"></script>
  <script th:src="@{/js/toast.js}"></script>
  <script th:src="@{/js/carrito-sync.js}"></script>
  <script th:src="@{/js/carrito.js}"></script>
  <script th:src="@{/js/navbar.js}"></script>
</th:block>

<!-- Fragmento vacío para scripts específicos de página -->
<th:block th:fragment="page-scripts"></th:block>
