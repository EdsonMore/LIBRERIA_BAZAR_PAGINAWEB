<!-- src/main/resources/templates/acceso-denegado.html -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
  </head>
  <body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6 text-center">
          <div class="card border-danger">
            <div class="card-header bg-danger text-white">
              <h3><i class="bi bi-shield-exclamation"></i> Acceso Denegado</h3>
            </div>
            <div class="card-body">
              <i
                class="bi bi-lock-fill text-danger"
                style="font-size: 4rem"
              ></i>
              <h4 class="mt-3 text-danger">
                No tienes permisos para acceder a esta página
              </h4>
              <p class="text-muted">
                Contacta al administrador si necesitas acceso a esta
                funcionalidad.
              </p>
              <div class="mt-4">
                <a th:href="@{/}" class="btn btn-primary me-2">
                  <i class="bi bi-house"></i> Ir al Inicio
                </a>
                <a th:href="@{/logout}" class="btn btn-outline-secondary">
                  <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/layout :: scripts}"></div>
  </body>
</html>
