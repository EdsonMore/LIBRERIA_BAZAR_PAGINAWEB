<!-- src/main/resources/templates/superAdmin/gestion-rutas.html -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/superadmin-layout :: head('Gestión de Rutas')}"
  ></head>
  <body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container-fluid mt-4">
      <div class="row">
        <aside
          th:replace="~{fragments/superadmin-layout :: sidebar(activeSection='rutas')}"
        ></aside>
        <main class="col-md-9 col-lg-10">
          <div
            th:replace="~{fragments/superadmin-layout :: page-header(titulo='Gestión de Rutas', descripcion='Administra las rutas de la aplicación y asigna permisos por rol')}"
          ></div>

          <!-- Estadísticas -->
          <div class="row mb-4">
            <div class="col-md-3">
              <div
                th:replace="~{fragments/superadmin-layout :: stat-card(valor=${totalRutas}, titulo='Rutas Totales', icono='signpost', color='primary')}"
              ></div>
            </div>
            <div class="col-md-3">
              <div
                th:replace="~{fragments/superadmin-layout :: stat-card(valor=${rutasPublicas}, titulo='Rutas Públicas', icono='globe', color='success')}"
              ></div>
            </div>
            <div class="col-md-3">
              <div
                th:replace="~{fragments/superadmin-layout :: stat-card(valor=${rutasPrivadas}, titulo='Rutas Privadas', icono='lock', color='warning')}"
              ></div>
            </div>
            <div class="col-md-3">
              <div
                th:replace="~{fragments/superadmin-layout :: stat-card(valor=${categoriasCount}, titulo='Categorías', icono='tags', color='info')}"
              ></div>
            </div>
          </div>

          <!-- Tabla de Rutas SIMPLIFICADA -->
          <div class="card">
            <div class="card-header bg-light">
              <h5 class="mb-0">
                <i class="bi bi-table"></i>
                Rutas del Sistema
                <span class="badge bg-secondary ms-2" th:text="${totalRutas}"
                  >0</span
                >
              </h5>
            </div>
            <div class="card-body p-0">
              <!-- Alert si no hay datos -->
              <div
                th:if="${rutas == null or rutas.isEmpty()}"
                class="alert alert-warning m-3"
              >
                <i class="bi bi-exclamation-triangle"></i>
                <strong>⚠️ No hay rutas en la BD</strong>
                <br />
                <small
                  >Total: <span th:text="${totalRutas}">0</span> rutas |
                  Públicas: <span th:text="${rutasPublicas}">0</span> |
                  Privadas: <span th:text="${rutasPrivadas}">0</span></small
                >
              </div>

              <!-- Tabla si hay datos -->
              <div
                th:if="${rutas != null and !rutas.isEmpty()}"
                class="table-responsive"
              >
                <table class="table table-sm table-hover mb-0">
                  <thead class="table-light">
                    <tr>
                      <th style="width: 25%">Ruta</th>
                      <th style="width: 8%">Método</th>
                      <th style="width: 12%">Categoría</th>
                      <th style="width: 10%">Tipo</th>
                      <th style="width: 20%">Descripción</th>
                      <th style="width: 15%">Roles</th>
                      <th style="width: 10%">Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="ruta : ${rutas}">
                      <td>
                        <code style="font-size: 11px" th:text="${ruta.ruta}"
                          >-</code
                        >
                      </td>
                      <td>
                        <span
                          class="badge"
                          th:classappend="'bg-' + (${ruta.metodo} == 'GET' ? 'info' : ${ruta.metodo} == 'POST' ? 'success' : ${ruta.metodo} == 'PUT' ? 'warning' : ${ruta.metodo} == 'DELETE' ? 'danger' : 'secondary')"
                          th:text="${ruta.metodo}"
                        >
                          GET
                        </span>
                      </td>
                      <td>
                        <small
                          class="text-muted"
                          th:text="${ruta.categoria} ?: 'Sin categoría'"
                          >-</small
                        >
                      </td>
                      <td>
                        <span th:if="${ruta.esPublica}" class="badge bg-success"
                          >Pública</span
                        >
                        <span
                          th:unless="${ruta.esPublica}"
                          class="badge bg-warning text-dark"
                          >Privada</span
                        >
                      </td>
                      <td>
                        <small
                          class="text-muted"
                          th:title="${ruta.descripcion}"
                          th:text="${#strings.abbreviate(ruta.descripcion ?: 'Sin descripción', 25)}"
                        >
                          -
                        </small>
                      </td>
                      <td>
                        <div
                          th:if="${ruta.nombresRoles != null and !ruta.nombresRoles.isEmpty()}"
                        >
                          <span
                            th:each="rolNombre, iter : ${ruta.nombresRoles}"
                            class="badge bg-secondary me-1 mb-1"
                            th:text="${rolNombre}"
                          >
                            ROLE
                          </span>
                        </div>
                        <span
                          th:if="${ruta.nombresRoles == null or ruta.nombresRoles.isEmpty()}"
                          class="text-muted small"
                          >∅ Sin roles</span
                        >
                      </td>
                      <td>
                        <button
                          class="btn btn-sm btn-outline-primary"
                          th:data-ruta-id="${ruta.id}"
                          data-bs-toggle="modal"
                          data-bs-target="#modalAsignarRol"
                          th:attr="onclick=|prepararModal(this)|"
                          title="Asignar roles"
                        >
                          <i class="bi bi-shield-check"></i>
                        </button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalAsignarRol" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title">Asignar Roles</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div id="rolesToAsign"></div>
          </div>
        </div>
      </div>
    </div>

    <th:block th:replace="~{fragments/superadmin-layout :: scripts}"></th:block>

    <script>
      // Función para obtener headers con CSRF token
      function getCSRFHeaders() {
        const token = document
          .querySelector('meta[name="_csrf"]')
          ?.getAttribute("content");
        const header = document
          .querySelector('meta[name="_csrf_header"]')
          ?.getAttribute("content");
        const headers = { "Content-Type": "application/json" };
        if (token && header) {
          headers[header] = token;
        }
        return headers;
      }

      function prepararModal(btn) {
        cargarRolesParaRuta(btn.getAttribute("data-ruta-id"));
      }

      function cargarRolesParaRuta(rutaId) {
        fetch(`/superAdmin/rutas/${rutaId}/roles-disponibles`)
          .then((r) => r.json())
          .then((data) => {
            const c = document.getElementById("rolesToAsign");
            c.innerHTML = data
              .map(
                (r) => `
            <div class="d-flex justify-content-between align-items-center p-2 border-bottom">
              <strong>${r.nombre}</strong>
              <button class="btn btn-sm ${
                r.asignado ? "btn-success" : "btn-outline-success"
              }"
                onclick="toggle(${rutaId}, ${r.id}, this)">
                ${r.asignado ? "✓" : "+"}
              </button>
            </div>
          `
              )
              .join("");
          });
      }

      function toggle(rutaId, rolId, btn) {
        const url = btn.textContent.includes("✓")
          ? `/superAdmin/rutas/${rutaId}/remover-rol/${rolId}`
          : `/superAdmin/rutas/${rutaId}/asignar-rol/${rolId}`;

        fetch(url, {
          method: "POST",
          headers: getCSRFHeaders(),
        })
          .then((r) => r.json())
          .then((d) => {
            if (d.exito) location.reload();
          });
      }
    </script>
  </body>
</html>
