<!-- src/main/resources/templates/superAdmin/gestion-compras.html -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block
      th:replace="fragments/superadmin-layout :: head('Gestión de Compras')"
    ></th:block>
  </head>
  <body>
    <!-- Navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container-fluid mt-4">
      <div class="row">
        <!-- Sidebar -->
        <th:block
          th:replace="fragments/superadmin-layout :: sidebar('compras')"
        ></th:block>

        <!-- Main Content -->
        <main class="col-md-9 col-lg-10">
          <!-- Header -->
          <th:block
            th:replace="fragments/superadmin-layout :: page-header('Gestión de Compras', 'Administra y monitorea todas las órdenes de compra')"
          ></th:block>

          <!-- Mensajes -->
          <div th:replace="fragments/messages :: flash-messages"></div>

          <!-- Estadísticas -->
          <div class="row g-3 mb-4">
            <div class="col-md-3">
              <th:block
                th:replace="fragments/superadmin-layout :: stat-card(${pendientes}, 'Pendientes', 'clock', 'warning')"
              ></th:block>
            </div>
            <div class="col-md-3">
              <th:block
                th:replace="fragments/superadmin-layout :: stat-card(${confirmadas}, 'Confirmadas', 'check-circle', 'info')"
              ></th:block>
            </div>
            <div class="col-md-3">
              <th:block
                th:replace="fragments/superadmin-layout :: stat-card(${enviadas}, 'Enviadas', 'truck', 'primary')"
              ></th:block>
            </div>
            <div class="col-md-3">
              <th:block
                th:replace="fragments/superadmin-layout :: stat-card(${entregadas}, 'Entregadas', 'box-seam', 'success')"
              ></th:block>
            </div>
          </div>

          <!-- Filtros -->
          <div class="card mb-4 shadow-sm">
            <div class="card-header">
              <i class="bi bi-funnel me-2"></i>Filtros y Búsqueda
            </div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="btn-group" role="group">
                    <button
                      type="button"
                      class="btn btn-outline-primary filtro-estado active"
                      data-estado="TODAS"
                    >
                      Todas
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-warning filtro-estado"
                      data-estado="PENDIENTE"
                    >
                      Pendientes
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-info filtro-estado"
                      data-estado="CONFIRMADA"
                    >
                      Confirmadas
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-secondary filtro-estado"
                      data-estado="DESPACHADO"
                    >
                      Despachadas
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-primary filtro-estado"
                      data-estado="ENVIADA"
                    >
                      Enviadas
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-success filtro-estado"
                      data-estado="ENTREGADA"
                    >
                      Entregadas
                    </button>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="bi bi-search"></i
                    ></span>
                    <input
                      type="text"
                      class="form-control"
                      id="buscarCompra"
                      placeholder="Buscar por ID, usuario o dirección..."
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Lista de compras -->
          <div class="card shadow-sm">
            <div class="card-header">
              <i class="bi bi-list-ul me-2"></i>Lista de Compras
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-hover">
                  <thead class="table-dark">
                    <tr>
                      <th>ID</th>
                      <th>Fecha</th>
                      <th>Usuario</th>
                      <th>Total</th>
                      <th>Estado</th>
                      <th>Método Pago</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr
                      th:each="compra : ${compras}"
                      class="compra-fila"
                      th:data-estado="${compra.estado}"
                    >
                      <td th:text="${compra.id}">1</td>
                      <td
                        th:text="${#temporals.format(compra.fechaCompra, 'dd/MM/yyyy HH:mm')}"
                      >
                        01/01/2024
                      </td>
                      <td
                        th:text="${compra.usuario.nombres} + ' ' + ${compra.usuario.apellidoPaterno}"
                      >
                        Usuario 1
                      </td>
                      <td
                        th:text="${'S/ ' + #numbers.formatDecimal(compra.total, 1, 2)}"
                      >
                        S/ 150.00
                      </td>
                      <td>
                        <span
                          th:classappend="'badge bg-' + ${compra.estado == 'PENDIENTE' ? 'warning' : 
                                                          compra.estado == 'CONFIRMADA' ? 'info' : 
                                                          compra.estado == 'DESPACHADO' ? 'secondary' :
                                                          compra.estado == 'ENVIADA' ? 'primary' : 'success'}"
                          th:text="${compra.estado}"
                          >PENDIENTE</span
                        >
                      </td>
                      <td 
                        th:text="${compra.metodoPago == 'contra_entrega' ? 'Contra Entrega' : 
                                  (compra.metodoPago == 'transferencia' ? 'Transferencia Bancaria' : 
                                  (compra.metodoPago == 'yape' ? 'Yape' : compra.metodoPago))}"
                      >Tarjeta</td>
                      <td>
                        <div class="btn-group btn-group-sm">
                          <button
                            class="btn btn-outline-primary"
                            th:onclick="|verDetalle(${compra.id})|"
                            title="Ver detalles"
                          >
                            <i class="bi bi-eye"></i>
                          </button>
                          <button
                            class="btn btn-outline-warning"
                            th:onclick="|cambiarEstado(${compra.id})|"
                            title="Cambiar estado"
                          >
                            <i class="bi bi-pencil"></i>
                          </button>
                        </div>
                      </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(compras)}">
                      <td colspan="7" class="text-center py-4 text-muted">
                        <i class="bi bi-cart fs-1 d-block mb-2"></i>
                        No hay compras registradas
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal estado -->
    <div class="modal fade" id="modalEstado" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Cambiar Estado de Compra</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="formActualizarEstado">
            <div class="modal-body">
              <input type="hidden" id="compraId" name="id" />
              <input type="hidden" id="estadoActual" name="estadoActual" />

              <div class="mb-3">
                <label for="nuevoEstado" class="form-label">Nuevo Estado</label>
                <select
                  class="form-select"
                  id="nuevoEstado"
                  name="estado"
                  required
                >
                  <option value="">Seleccionar estado...</option>
                  <option value="PENDIENTE">Pendiente</option>
                  <option value="CONFIRMADA">Confirmada</option>
                  <option value="DESPACHADO">Despachado</option>
                  <option value="ENVIADA">Enviada</option>
                  <option value="ENTREGADA">Entregada</option>
                  <option value="RECHAZADA">Rechazada</option>
                </select>
              </div>

              <div class="mb-3" id="seguimientoContainer" style="display: none">
                <label for="numeroSeguimiento" class="form-label"
                  >Número de Seguimiento</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="numeroSeguimiento"
                  name="numeroSeguimiento"
                  placeholder="Ingrese número de seguimiento"
                />
              </div>

              <div class="mb-3" id="motivoRechazoContainer" style="display: none">
                <label for="motivoRechazo" class="form-label">
                  Motivo de Rechazo <span class="text-danger">*</span>
                </label>
                <textarea
                  class="form-control"
                  id="motivoRechazo"
                  name="motivoRechazo"
                  rows="3"
                  placeholder="Explique el motivo del rechazo de la compra..."
                  required
                ></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary" id="btnActualizarEstado">
                Actualizar Estado
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <th:block th:replace="fragments/superadmin-layout :: scripts"></th:block>

    <script>
      // Función para obtener headers con CSRF token
      function getCSRFHeaders() {
        const csrfToken = document
          .querySelector('meta[name="_csrf"]')
          .getAttribute('content');
        const csrfHeader = document
          .querySelector('meta[name="_csrf_header"]')
          .getAttribute('content');

        return {
          [csrfHeader]: csrfToken,
          'Content-Type': 'application/x-www-form-urlencoded',
        };
      }

      document.querySelectorAll(".filtro-estado").forEach((btn) => {
        btn.addEventListener("click", function () {
          const estado = this.getAttribute("data-estado");

          document
            .querySelectorAll(".filtro-estado")
            .forEach((b) => b.classList.remove("active"));
          this.classList.add("active");

          document.querySelectorAll(".compra-fila").forEach((fila) => {
            fila.style.display =
              estado === "TODAS" || fila.getAttribute("data-estado") === estado
                ? ""
                : "none";
          });
        });
      });

      document
        .getElementById("buscarCompra")
        .addEventListener("input", function (e) {
          const searchTerm = e.target.value.toLowerCase();
          document.querySelectorAll(".compra-fila").forEach((fila) => {
            fila.style.display = fila.textContent
              .toLowerCase()
              .includes(searchTerm)
              ? ""
              : "none";
          });
        });

      document
        .getElementById("nuevoEstado")
        .addEventListener("change", function () {
          document.getElementById("seguimientoContainer").style.display =
            this.value === "ENVIADA" ? "block" : "none";
        });

      // Event listener para el formulario de estado (AJAX)
      document.getElementById('formActualizarEstado').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const compraId = document.getElementById("compraId").value;
        const estado = document.getElementById("nuevoEstado").value;
        const numeroSeguimiento = document.getElementById("numeroSeguimiento").value;
        const motivoRechazo = document.getElementById("motivoRechazo").value;
        
        console.log("📤 Enviando actualización - ID: " + compraId + ", Estado: " + estado);
        
        if (!estado || estado === "") {
          Swal.fire('Error', 'Por favor selecciona un estado', 'error');
          return;
        }
        
        // Validar motivo de rechazo si se selecciona RECHAZADA
        if (estado === "RECHAZADA" && (!motivoRechazo || motivoRechazo.trim() === "")) {
          Swal.fire('Error', 'El motivo de rechazo es obligatorio', 'error');
          return;
        }
        
        const submitBtn = document.getElementById("btnActualizarEstado");
        const originalText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Procesando...';
        
        // Crear parámetros URL
        const params = new URLSearchParams();
        params.append("id", compraId);
        params.append("estado", estado);
        if (numeroSeguimiento) {
          params.append("numeroSeguimiento", numeroSeguimiento);
        }
        if (motivoRechazo) {
          params.append("motivoRechazo", motivoRechazo);
        }
        
        // Obtener headers con CSRF
        const headers = getCSRFHeaders();
        console.log("🔐 Headers con CSRF:", Object.keys(headers));
        
        // Enviar con AJAX
        fetch('/superAdmin/compras/actualizar-estado', {
          method: 'POST',
          headers: headers,
          body: params.toString()
        })
        .then(response => {
          console.log("📥 Respuesta recibida:", response.status);
          if (!response.ok) {
            throw new Error('Error en la respuesta del servidor: ' + response.status);
          }
          return response.json();
        })
        .then(data => {
          console.log("📦 Datos JSON recibidos:", data);
          
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
          
          if (data.success) {
            console.log("✅ Estado actualizado exitosamente");
            // Mostrar notificación de éxito
            Swal.fire({
              title: '¡Éxito!',
              text: data.message || 'Estado actualizado correctamente',
              icon: 'success',
              confirmButtonText: 'OK'
            }).then(() => {
              // Cerrar modal
              const modal = bootstrap.Modal.getInstance(document.getElementById('modalEstado'));
              if (modal) modal.hide();
              
              // Recargar la página después de un breve delay
              setTimeout(() => {
                window.location.href = '/superAdmin/compras';
              }, 500);
            });
          } else {
            console.error("❌ Error en respuesta:", data.error);
            Swal.fire({
              title: 'Error',
              text: data.error || 'Error al actualizar el estado',
              icon: 'error',
              confirmButtonText: 'OK'
            });
          }
        })
        .catch(error => {
          console.error('❌ Error en fetch:', error);
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
          Swal.fire({
            title: 'Error',
            text: 'Error al actualizar el estado: ' + error.message,
            icon: 'error',
            confirmButtonText: 'OK'
          });
        });
      });

      function verDetalle(compraId) {
        console.log("📋 Cargando detalle de compra ID:", compraId);
        
        Swal.fire({
          title: "Cargando...",
          text: "Obteniendo información",
          icon: "info",
          showConfirmButton: false,
          allowOutsideClick: false,
        });

        fetch("/superAdmin/compras/" + compraId)
          .then((response) => {
            console.log("📥 Respuesta del servidor:", response.status);
            if (!response.ok) {
              throw new Error("Error " + response.status + " al cargar la compra");
            }
            return response.json();
          })
          .then((compra) => {
            console.log("✅ Compra cargada:", compra);
            
            // Construir tabla de productos
            let productosHTML = "";
            if (compra.detalles && compra.detalles.length > 0) {
              productosHTML = `
                <div class="table-responsive mt-3">
                  <table class="table table-sm table-bordered">
                    <thead class="table-light">
                      <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio Unit.</th>
                        <th>Subtotal</th>
                      </tr>
                    </thead>
                    <tbody>
              `;

              compra.detalles.forEach((detalle) => {
                productosHTML += `
                  <tr>
                    <td>
                      <div class="d-flex align-items-center">
                        <img src="${
                          detalle.productoImagen || "/img/default-product.png"
                        }" 
                             alt="${detalle.productoNombre}" 
                             style="width: 40px; height: 40px; object-fit: cover; margin-right: 10px;">
                        <span>${detalle.productoNombre}</span>
                      </div>
                    </td>
                    <td class="text-center">${detalle.cantidad}</td>
                    <td class="text-end">S/ ${detalle.precioUnitario.toFixed(
                      2
                    )}</td>
                    <td class="text-end">S/ ${detalle.subtotal.toFixed(2)}</td>
                  </tr>
                `;
              });

              productosHTML += `
                    </tbody>
                  </table>
                </div>
              `;
            }

            Swal.fire({
              title: `Detalle de Compra #${compra.id}`,
              html: `
                <div class="text-start">
                  <h6 class="border-bottom pb-2 mb-3"><i class="bi bi-person-circle me-2"></i>Información del Cliente</h6>
                  <p><strong>Nombre:</strong> ${compra.usuario.nombres} ${
                compra.usuario.apellidoPaterno
              }</p>
                  <p><strong>Email:</strong> ${compra.usuario.correo}</p>
                  <p><strong>Teléfono:</strong> ${
                    compra.usuario.numero || "No proporcionado"
                  }</p>
                  <p><strong>Dirección:</strong> ${compra.direccionEntrega}</p>
                  
                  <h6 class="border-bottom pb-2 mb-3 mt-4"><i class="bi bi-cart-check me-2"></i>Información de Compra</h6>
                  <p><strong>Fecha:</strong> ${new Date(
                    compra.fechaCompra
                  ).toLocaleString("es-PE", {
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit",
                  })}</p>
                  <p><strong>Método de Pago:</strong> ${
                    compra.metodoPago === 'contra_entrega' ? 'Contra Entrega' :
                    compra.metodoPago === 'transferencia' ? 'Transferencia Bancaria' :
                    compra.metodoPago === 'yape' ? 'Yape' :
                    compra.metodoPago
                  }</p>
                  <p><strong>Estado:</strong> <span class="badge bg-${getBadgeColor(
                    compra.estado
                  )}">${compra.estado}</span></p>
                  ${
                    compra.numeroSeguimiento
                      ? `<p><strong>Seguimiento:</strong> ${compra.numeroSeguimiento}</p>`
                      : ""
                  }
                  ${
                    compra.estado === 'RECHAZADA' && compra.motivoRechazo
                      ? `<div class="alert alert-danger mt-2"><strong>Motivo de Rechazo:</strong> ${compra.motivoRechazo}</div>`
                      : ""
                  }
                  
                  <h6 class="border-bottom pb-2 mb-3 mt-4"><i class="bi bi-box-seam me-2"></i>Productos</h6>
                  ${productosHTML}
                  
                  <div class="mt-3 p-3 bg-light rounded">
                    <div class="d-flex justify-content-between">
                      <span>Subtotal:</span>
                      <strong>S/ ${compra.subtotal.toFixed(2)}</strong>
                    </div>
                    <div class="d-flex justify-content-between">
                      <span>IGV (18%):</span>
                      <strong>S/ ${compra.igv.toFixed(2)}</strong>
                    </div>
                    <div class="d-flex justify-content-between">
                      <span>Costo de Envío:</span>
                      <strong>S/ ${compra.costoEnvio.toFixed(2)}</strong>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fs-5">
                      <span><strong>Total:</strong></span>
                      <strong class="text-primary">S/ ${compra.total.toFixed(
                        2
                      )}</strong>
                    </div>
                  </div>
                </div>
              `,
              width: "800px",
              confirmButtonText: "Cerrar",
              customClass: {
                popup: "text-start",
              },
            });
          })
          .catch((error) => {
            console.error("❌ Error al cargar compra:", error);
            Swal.fire({
              title: "Error",
              text: "No se pudo cargar la información de la compra: " + error.message,
              icon: "error",
              confirmButtonText: "OK"
            });
          });
      }

      function cambiarEstado(compraId) {
        console.log("📝 Abriendo modal de cambio de estado para compra ID:", compraId);
        
        // Establecer el ID de la compra
        document.getElementById("compraId").value = compraId;
        
        // Obtener datos actuales de la compra para preseleccionar el estado
        fetch("/superAdmin/compras/" + compraId)
          .then(response => {
            if (!response.ok) throw new Error("Error al cargar");
            return response.json();
          })
          .then(compra => {
            console.log("✅ Compra obtenida, estado actual:", compra.estado);
            
            // Guardar estado actual
            document.getElementById("estadoActual").value = compra.estado;
            
            // Preseleccionar el estado actual
            document.getElementById("nuevoEstado").value = compra.estado;
            console.log("✅ Dropdown actualizado con estado:", compra.estado);
            
            // Limpiar el campo de seguimiento
            document.getElementById("numeroSeguimiento").value = compra.numeroSeguimiento || "";
            
            // Limpiar motivo de rechazo
            document.getElementById("motivoRechazo").value = "";
            
            // FILTRAR ESTADOS PERMITIDOS según las reglas
            filtrarEstadosPermitidos(compra.estado);
            
            // Mostrar u ocultar el campo de seguimiento según el estado actual
            const seguimientoContainer = document.getElementById("seguimientoContainer");
            if (compra.estado === "ENVIADA") {
              seguimientoContainer.style.display = "block";
            } else {
              seguimientoContainer.style.display = "none";
            }
            
            // Abrir el modal
            const modal = new bootstrap.Modal(document.getElementById("modalEstado"));
            modal.show();
            console.log("✅ Modal abierto con estado preseleccionado");
          })
          .catch(error => {
            console.error("❌ Error al cargar compra:", error);
            Swal.fire({
              title: "Error",
              text: "No se pudo cargar la información actual de la compra",
              icon: "error",
              confirmButtonText: "OK"
            });
          });
      }

      /**
       * Filtra los estados permitidos en el dropdown según el estado actual
       * Implementa las reglas de transición de estado
       */
      function filtrarEstadosPermitidos(estadoActual) {
        const nuevoEstadoSelect = document.getElementById("nuevoEstado");
        const motivoRechazoContainer = document.getElementById("motivoRechazoContainer");
        
        // Mapear estados permitidos por estado actual
        const estadosPermitidos = {
          "PENDIENTE": ["PENDIENTE", "CONFIRMADA", "RECHAZADA"],
          "CONFIRMADA": ["CONFIRMADA", "DESPACHADO", "RECHAZADA"],
          "DESPACHADO": ["DESPACHADO", "ENVIADA"],
          "ENVIADA": ["ENVIADA", "ENTREGADA"],
          "ENTREGADA": ["ENTREGADA"],  // Estado final
          "RECHAZADA": ["RECHAZADA"]   // Estado final
        };
        
        const permitidos = estadosPermitidos[estadoActual] || [];
        console.log("📋 Estados permitidos para " + estadoActual + ":", permitidos);
        
        // Deshabilitar todas las opciones
        Array.from(nuevoEstadoSelect.options).forEach(option => {
          if (option.value === "") {
            option.disabled = false; // Siempre permitir "Seleccionar estado..."
          } else {
            option.disabled = !permitidos.includes(option.value);
          }
        });
        
        // Mostrar/ocultar campo de motivo de rechazo
        if (permitidos.includes("RECHAZADA")) {
          // Agregar listener al select para mostrar el campo cuando se seleccione RECHAZADA
          nuevoEstadoSelect.addEventListener("change", function() {
            if (this.value === "RECHAZADA") {
              motivoRechazoContainer.style.display = "block";
            } else {
              motivoRechazoContainer.style.display = "none";
            }
          });
        } else {
          motivoRechazoContainer.style.display = "none";
        }
      }

      function getBadgeColor(estado) {
        const colors = {
          PENDIENTE: "warning",
          CONFIRMADA: "info",
          DESPACHADO: "secondary",
          ENVIADA: "primary",
          ENTREGADA: "success",
          RECHAZADA: "danger",
        };
        return colors[estado] || "secondary";
      }
    </script>
  </body>
</html>
