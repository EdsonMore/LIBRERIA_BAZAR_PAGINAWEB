spring.application.name=licoreriaApp
server.port=${PORT:8090}

# =========================================
# CONFIGURACIÓN THYMELEAF
# =========================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =========================================
# CONFIGURACIÓN BASE DE DATOS
# =========================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/licoreriaapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:080505}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# CONFIGURACIÓN JPA/HIBERNATE
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================
# CONFIGURACIÓN LOGGING - DEBUG
# =========================================
logging.level.com.example.licoreriaApp.controller.RutaController=TRACE
logging.level.com.example.licoreriaApp.service.RutaService=DEBUG
logging.level.com.example.licoreriaApp.service.impl.RutaServiceImpl=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm=DEBUG
logging.level.org.thymeleaf=DEBUG
logging.level.org.thymeleaf.TemplateEngine=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.example.licoreriaApp.service.CustomUserDetailsService=DEBUG

# =========================================
# CONFIGURACIÓN RECURSOS ESTÁTICOS
# =========================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.mvc.static-path-pattern=/static/**

# =========================================
# CONFIGURACIÓN MENSAJES
# =========================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# =========================================
# CONFIGURACIÓN JACKSON
# =========================================
spring.jackson.serialization.indent_output=true
spring.jackson.serialization.fail-on-empty-beans=false

# =========================================
# CONFIGURACIÓN ERRORES
# =========================================
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always

# =========================================
# CONFIGURACIÓN SEGURIDAD PERSONALIZADA
# =========================================
app.roles.super-admin=ROLE_SUPER_ADMIN
app.roles.admin=ROLE_ADMIN
app.roles.encargado-productos=ROLE_ENCARGADO_PRODUCTOS
app.roles.encargado-ventas=ROLE_ENCARGADO_VENTAS
app.roles.cliente=ROLE_CLIENTE

# =========================================
# CONFIGURACIÓN ADICIONAL
# =========================================
server.servlet.session.timeout=30m
server.servlet.context-path=/
server.max-http-header-size=8192
server.compression.enabled=false